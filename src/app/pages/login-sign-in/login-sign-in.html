<section class="signin-container">
	<form class="signin-form" novalidate (submit)="submit($event)">
		<h2>Create an account</h2>

		<div class="form-row">
			<label for="firstName">First name</label>
			<input id="firstName" name="firstName" type="text" placeholder="Enter your first name" required />
		</div>

		<div class="form-row">
			<label for="lastName">Last name</label>
			<input id="lastName" name="lastName" type="text" placeholder="Enter your last name" required />
		</div>

		<div class="form-row">
			<label for="username">Username</label>
			<input id="username" name="username" type="text" placeholder="Choose a username" required />
		</div>

		<div class="form-row">
			<label for="email">Email</label>
			<input id="email" name="email" type="email" placeholder="you@example.com" required />
		</div>

		<div class="form-row">
			<label for="password">Password</label>
			<input id="password" name="password" type="password" placeholder="Create a password" required />
		</div>

		<div class="form-actions">
			<button type="submit">Sign up</button>
		</div>

		<div class="form-footer">
			<a class="link-login" href="#">Log in</a>
			<a class="link-forgot" href="#">Forgot your password?</a>
		</div>
	</form>
</section>
