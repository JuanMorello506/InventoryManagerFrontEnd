<section class="signin-container">
  <form class="signin-form" [formGroup]="loginForm" (ngSubmit)="logIn()">
    <h2>Log In</h2>

    <div class="form-row">
      <label for="Username">Username</label>
      <input id="Username" type="text" placeholder="Choose a username" formControlName="Username" />
    </div>

    <div class="form-row">
      <label for="Password">Password</label>
      <input id="Password" type="password" placeholder="Create a password" formControlName="Password" />
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="loginForm.invalid">Log In</button>
    </div>

    <div class="form-footer">
      <a routerLink="/signIn" class="link-login" (click)="changeToSignIn()">Create an account</a>
      <a class="link-forgot" href="#">Forgot your password?</a>
    </div>
  </form>

  <div *ngIf="message" [class.error-message]="isError" [class.success-message]="!isError">
    <p>{{ message }}</p>
  </div>
</section>
